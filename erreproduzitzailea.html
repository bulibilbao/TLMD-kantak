<!doctype html><html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>TLMD kantak · Jotzailea</title><link rel="icon" type="image/jpeg" href="portada.jpg"><link rel="apple-touch-icon" href="portada.jpg"><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--panel2:#182338;--text:#f5f7fb;--muted:#a6b1c4;--line:#2a3650;--accent:#a8f06a;--accent2:#c7ff98;--danger:#ffb6b6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#17233a 0%,var(--bg) 58%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;min-height:100vh}
.wrap{width:min(100% - 28px,1050px);margin:0 auto}
header{padding:32px 0 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px}.logo{display:block;width:46px;height:46px;flex:0 0 46px;object-fit:cover;border-radius:12px;box-shadow:0 8px 30px #0003}
h1{margin:0;font-size:clamp(27px,5vw,39px);letter-spacing:-1.2px;font-weight:850}.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}

.player-panel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr);gap:16px;padding:16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#18243a,#101726);box-shadow:0 18px 55px #0003;margin-bottom:22px}
.video-wrap{aspect-ratio:16/9;background:#05070c;border-radius:13px;overflow:hidden;position:relative}
#player,#player iframe{width:100%;height:100%;display:block}
.player-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:radial-gradient(circle at 50% 30%,#253652,#080c15)}
.big-note{font-size:36px;display:block;margin-bottom:7px;color:var(--accent)}
.player-side{display:flex;flex-direction:column;min-width:0}
.now-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:800;margin:3px 0 8px}
#now-title{font-size:21px;line-height:1.2;font-weight:850;margin:0 0 5px;overflow-wrap:anywhere}
#now-meta-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin:0 0 13px}#now-artist{color:var(--muted);margin:0;overflow-wrap:anywhere}#now-date-sender{color:var(--muted);font-size:12px;margin:0;text-align:right;overflow-wrap:anywhere}
.controls{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 12px}.transport-controls{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}.transport-controls button{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;width:40px;min-width:40px;height:40px;padding:5px;font-size:18px;line-height:1;display:grid;place-items:center;background:var(--accent);color:#101827;border-color:var(--accent)}.transport-controls button.primary{width:46px;min-width:46px;height:46px;padding:7px;font-size:23px;background:var(--accent);color:#101827;border-color:var(--accent)}.transport-controls button:hover,.transport-controls button.primary:hover{background:var(--accent2);border-color:var(--accent2)}
#playpause::before{content:"";display:block;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:13px solid currentColor;margin-left:3px}#playpause.is-playing::before{width:14px;height:16px;border:0;margin-left:0;background:linear-gradient(to right,currentColor 0 4px,transparent 4px 10px,currentColor 10px 14px)}.random-button{width:auto;max-width:100%;font-size:13px;min-height:38px;padding:8px 15px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:42px;background:var(--panel2);color:var(--text);font-weight:750}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a8f06a88;outline-offset:2px}
button.primary{background:var(--accent);color:#101827;border-color:var(--accent)}button.primary:hover{background:var(--accent2)}
button:disabled{opacity:.4;cursor:not-allowed}.subtle{font-size:12px;color:var(--muted);margin:auto 0 0}
.queue-box{border-top:1px solid var(--line);padding-top:11px;margin-top:10px;min-height:0}
.queue-heading{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.queue-heading strong{font-size:13px}.queue-heading button{font-size:11px;min-height:30px;padding:5px 8px;background:#e8eadf;color:#111827;border-color:#e8eadf}.queue-heading button:hover{background:#f3f3e9;border-color:#f3f3e9}
#queue{list-style:none;padding:0;margin:0;max-height:138px;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.queue-item{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:12px;color:var(--muted);cursor:pointer}
.queue-item.active{background:#a8f06a18;color:var(--text);border:1px solid #a8f06a55}
.queue-num{color:var(--accent);font-weight:850;min-width:17px}.queue-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px;background:#121a2be8;border:1px solid var(--line);border-radius:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}label{font-size:12px;font-weight:750;color:#dce4f1}

.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0 10px}

.song:hover{border-color:#536580;background:#172238}.song-main{min-width:0;flex:1}.artist{margin:0 0 2px;font-size:15px;font-weight:850;overflow-wrap:anywhere}.title{margin:0;font-size:14px;overflow-wrap:anywhere}
.meta{margin:7px 0 0;color:var(--muted);font-size:12px}.song-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.song-actions button{font-size:12px;min-height:36px;padding:7px 10px}.add{color:var(--accent);border-color:#a8f06a55}.telegram{border-color:#4b91c7;color:#b9e1ff}
.empty{padding:24px 14px;border:1px dashed #46536a;border-radius:12px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:12px}
.intro-screen{position:fixed;inset:0;z-index:9999;width:100%;height:100vh;height:100dvh;display:grid;place-items:center;margin:0;padding:0;border:0;border-radius:0;background:radial-gradient(ellipse at center,#17233a 0%,#0b1020 68%);color:#fff;font-size:clamp(42px,12vw,82px);font-weight:900;letter-spacing:.12em;line-height:1;box-shadow:none;opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s linear 0s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.intro-screen:hover{background:radial-gradient(ellipse at center,#17233a 0%,#0b1020 68%)}
.intro-screen.is-hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s}
.intro-screen:focus-visible{outline:3px solid var(--accent);outline-offset:-8px}

@media(max-width:540px){.transport-controls{gap:11px}.transport-controls button{width:35px;min-width:35px;height:35px;font-size:16px;padding:3px}.transport-controls button.primary{width:41px;min-width:41px;height:41px;font-size:20px;padding:5px}#now-date-sender{font-size:11px}header{padding-top:24px}.filters{grid-template-columns:1fr;padding:13px;gap:11px}.summary{align-items:flex-start;flex-direction:column}.song{align-items:flex-start;flex-wrap:wrap;padding:12px}.song-actions{width:100%}.song-actions button{flex:1}.brand{gap:10px}.logo{width:42px;height:42px}.player-panel{border-radius:15px}}

.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:0 0 14px}
.page-actions button{min-height:38px}.page-actions #shuffle{background:#f1f0e7;color:#111827;border-color:#f1f0e7;font-weight:850}.page-actions #shuffle:hover{background:#fffdf4;border-color:#fffdf4}.page-actions #search-page{background:#dbe6d3;color:#111827;border-color:#dbe6d3;font-weight:850}.page-actions #search-page:hover{background:#e8f0e2;border-color:#e8f0e2}#player-status{display:none}
.back-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);border-radius:11px;padding:9px 12px;color:var(--text);background:var(--panel2);font-weight:750;font-size:13px}
.search-page-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:540px){.page-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.page-actions button{width:100%}}

  <div class="video-wrap"><div id="player"></div><div id="player-placeholder" class="player-placeholder"><div><span class="big-note">♫</span><strong>Aukeratu kanta bat</strong><br><span>eta hasi gure soinu banda entzuten</span></div></div></div>
  <div class="player-side">
    <p class="now-label">Orain entzuten</p><h2 id="now-title">Oraindik ez dago kantarik</h2><div id="now-meta-line"><p id="now-artist">Gehitu abestiak ilarara</p><p id="now-date-sender"></p></div>
    <div class="controls">
      <div class="transport-controls">
        <button id="prev" aria-label="Aurreko kanta" title="Aurreko kanta" disabled>|◀</button><button id="playpause" class="primary" aria-label="Erreproduzitu" title="Erreproduzitu" disabled></button><button id="next" aria-label="Hurrengo kanta" title="Hurrengo kanta" disabled>▶|</button>

    <div class="queue-box"><div class="queue-heading"><strong>🎶 Erreprodukzio-ilara (<span id="queue-count">0</span>)</strong><button id="clear-queue" type="button">Ilara hustu</button></div><ol id="queue"></ol></div>
  </div>
</section></main><footer><div class="wrap">TLMD kantak · soinu banda</div></footer><script>const DATA_FILE="kantak.txt";
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("eu").trim()}
function parseDate(v){const m=String(v??"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]),dt=new Date(Date.UTC(y,mo-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d?dt:null}
function parseTsv(text){const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim()!=="");if(lines.length<2)throw Error("Fitxategia hutsik dago edo goiburuak bakarrik ditu.");const headers=lines[0].split("\t").map(norm),idx=n=>headers.indexOf(norm(n)),required=["Data","Ordua","Izena","URL","Artista","Abestia"],missing=required.filter(n=>idx(n)<0);if(missing.length)throw Error("Ez ditut zutabe hauek aurkitu: "+missing.join(", ")+". Egiaztatu goiburuak eta tabuladoreak.");return lines.slice(1).map((line,i)=>{const c=line.split("\t"),get=n=>(c[idx(n)]??"").trim(),date=parseDate(get("Data")),artist=get("Artista"),song=get("Abestia");if(!artist&&!song)return null;return{id:get("Zkia")||String(i+1),year:get("Urtea")||(date?String(date.getUTCFullYear()):""),dateText:get("Data"),date:date?date.toISOString():null,time:get("Ordua"),sender:get("Izena"),url:get("URL"),artist,song,videoId:extractVideoId(get("URL"))}}).filter(Boolean)}
function extractVideoId(raw){try{const u=new URL(raw);if(u.hostname.includes("youtu.be"))return u.pathname.split("/").filter(Boolean)[0]||null;if(u.hostname.includes("youtube.com")||u.hostname.includes("youtube-nocookie.com")){if(u.searchParams.get("v"))return u.searchParams.get("v");const p=u.pathname.split("/").filter(Boolean),i=p.findIndex(x=>["embed","shorts","live","v"].includes(x));if(i>=0&&p[i+1])return p[i+1]}}catch{}return null}
function fill(select,values,label){select.replaceChildren(new Option(label,""));[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"eu",{sensitivity:"base"})).forEach(v=>select.add(new Option(v,v)))}

const playerStatus=document.getElementById("player-status"),placeholder=document.getElementById("player-placeholder");
let songs=[],queue=loadQueueState(),queueIndex=Number(localStorage.getItem("tlmd_queue_index")||0),player=null,playerReady=false,pendingVideo=null;
function loadQueueState(){try{const q=JSON.parse(localStorage.getItem("tlmd_queue")||"[]");return Array.isArray(q)?q:[]}catch{return []}}
function saveQueueState(){try{localStorage.setItem("tlmd_queue",JSON.stringify(queue));localStorage.setItem("tlmd_queue_index",String(queueIndex))}catch{}}
function addToQueue(song){if(!song.videoId){playerStatus.textContent="Abesti honek ez du YouTubeko bideo-esteka erabilgarririk.";return}queue.push(song);saveQueueState();renderQueue();if(queue.length===1)playIndex(0)}
function renderQueue(){const ol=document.getElementById("queue");ol.replaceChildren();document.getElementById("queue-count").textContent=queue.length;queue.forEach((s,i)=>{const li=document.createElement("li");li.className="queue-item"+(i===queueIndex?" active":"");li.title="Kanta hau erreproduzitu";const num=document.createElement("span");num.className="queue-num";num.textContent=(i+1)+".";const label=document.createElement("span");label.className="queue-label";label.textContent=(s.artist||"Artista ezezaguna")+" — "+(s.song||"Izenbururik gabe");li.append(num,label);li.addEventListener("click",()=>playIndex(i));ol.append(li);if(i===queueIndex)requestAnimationFrame(()=>ol.scrollTo({top:Math.max(0,li.offsetTop-ol.offsetTop),behavior:"smooth"}))});document.getElementById("prev").disabled=queue.length<2;document.getElementById("next").disabled=queue.length<2;document.getElementById("playpause").disabled=!queue.length}
function updateNowMeta(s){document.getElementById("now-artist").textContent=s.artist||"Artista ezezaguna";document.getElementById("now-date-sender").textContent=[s.dateText,s.sender].filter(Boolean).join(" · ");}
function playIndex(index){if(!queue.length)return;queueIndex=(index+queue.length)%queue.length;saveQueueState();const s=queue[queueIndex];document.getElementById("now-title").textContent=s.song||"Izenbururik gabe";updateNowMeta(s);placeholder.style.display="none";renderQueue();if(!s.videoId){playerStatus.textContent="Ez dago bideo ID erabilgarririk kanta honetarako.";return}if(playerReady&&player){player.loadVideoById(s.videoId);playerStatus.textContent="YouTube erreproduzitzailea prest."}else{playerStatus.textContent="YouTube erreproduzitzailea kargatzen…";pendingVideo=s.videoId;loadApi()}}
function loadApi(){if(document.getElementById("youtube-iframe-api"))return;const tag=document.createElement("script");tag.id="youtube-iframe-api";tag.src="https://www.youtube.com/iframe_api";document.head.append(tag)}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("player",{width:"100%",height:"100%",videoId:pendingVideo||undefined,playerVars:{playsinline:1,rel:0,origin:location.origin},events:{onReady:()=>{playerReady=true;playerStatus.textContent="Prest. Sakatu erreproduzitzeko botoia beharrezkoa bada.";if(pendingVideo)player.loadVideoById(pendingVideo)},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING)setPlayButton(true);else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)setPlayButton(false);if(e.data===YT.PlayerState.ENDED)nextSong()},onError:()=>{playerStatus.textContent="YouTubek ezin izan du bideo hau erreproduzitu. Hurrengo kantara pasatzen…";setTimeout(nextSong,1800)}}})};
function nextSong(){if(!queue.length)return;if(queue.length===1){playerStatus.textContent="Amaitu da kanta.";return}playIndex(queueIndex+1)}
document.getElementById("prev").addEventListener("click",()=>playIndex(queueIndex-1));document.getElementById("next").addEventListener("click",nextSong);
function setPlayButton(playing){const b=document.getElementById("playpause");b.classList.toggle("is-playing",playing);b.setAttribute("aria-label",playing?"Pausatu":"Erreproduzitu");b.title=playing?"Pausatu":"Erreproduzitu"}
document.getElementById("playpause").addEventListener("click",()=>{if(!queue.length)return;if(!playerReady){playIndex(queueIndex);return}const state=player.getPlayerState();if(state===YT.PlayerState.PLAYING){player.pauseVideo();setPlayButton(false)}else{player.playVideo();setPlayButton(true)}});
document.getElementById("shuffle").addEventListener("click",()=>{const eligible=songs.filter(s=>s.videoId);if(!eligible.length){playerStatus.textContent="Ez dago YouTube bideorik duen kantarik.";return}const pickRandom=(arr,n)=>{const pool=[...arr],out=[];while(pool.length&&out.length<n){const i=Math.floor(Math.random()*pool.length);out.push(pool.splice(i,1)[0])}return out};const already=new Set(queue.map(s=>s.id));let batch=pickRandom(eligible.filter(s=>!already.has(s.id)),10);if(batch.length<10){const picked=new Set(batch.map(s=>s.id));batch=batch.concat(pickRandom(eligible.filter(s=>!picked.has(s.id)),10-batch.length))}if(!batch.length){playerStatus.textContent="Ez dago kanta erabilgarririk.";return}const wasEmpty=queue.length===0;queue.push(...batch);saveQueueState();renderQueue();if(wasEmpty)playIndex(0);playerStatus.textContent=batch.length+" kanta ausaz gehitu dira ilararen amaieran."});
document.getElementById("search-page").addEventListener("click",()=>{window.open("bilatu.html","_blank");});
document.getElementById("clear-queue").addEventListener("click",()=>{if(queue.length){const currentSong=queue[queueIndex];queue=currentSong?[currentSong]:[];queueIndex=0;saveQueueState();renderQueue();playerStatus.textContent="Ilarako gainerako kantak kendu dira; unekoa mantendu dugu.";}else{queueIndex=0;saveQueueState();renderQueue();playerStatus.textContent="Ilaran ez dago kantarik.";}});
async function start(){try{const r=await fetch(DATA_FILE,{cache:"no-store"});if(!r.ok)throw Error("Ezin izan da kantak.txt kargatu (errorea "+r.status+"). Egiaztatu fitxategia orri honen ondoan dagoela.");songs=parseTsv(await r.text());if(queue.length){queueIndex=Math.max(0,Math.min(Number(localStorage.getItem("tlmd_queue_index")||queueIndex),queue.length-1));const shouldPlay=localStorage.getItem("tlmd_play_on_load")==="1";localStorage.removeItem("tlmd_play_on_load");const s=queue[queueIndex];if(shouldPlay){playIndex(queueIndex)}else{document.getElementById("now-title").textContent=s.song||"Izenbururik gabe";updateNowMeta(s);playerStatus.textContent="Ilaratik jarraitzen dugu. Sakatu ▶ erreproduzitzen hasteko.";}}renderQueue()}catch(e){playerStatus.textContent=e.message}}
window.addEventListener("storage",e=>{if(e.key==="tlmd_queue"){queue=loadQueueState();queueIndex=Math.max(0,Math.min(queueIndex,Math.max(0,queue.length-1)));renderQueue()}});start();
</script></body></html>
