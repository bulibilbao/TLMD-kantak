<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>TLMD kantak · Musika-bilduma</title>
<style>
:root{color-scheme:light;--text:#202124;--muted:#666b73;--line:#e4e6e8;--soft:#f6f7f8;--accent:#1457d9;--hover:#0d43ad}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{width:min(100% - 32px,1000px);margin:0 auto}header{padding:38px 0 22px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-1.2px;font-weight:750}.subtitle{margin:7px 0 0;color:var(--muted);font-size:15px}
main{padding:24px 0 48px}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:18px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}label{font-size:13px;font-weight:650}
input,select,button{font:inherit;min-height:43px;border:1px solid #d4d7db;border-radius:9px;padding:9px 11px;background:white;color:var(--text);width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #b7cdfd;outline-offset:1px;border-color:var(--accent)}
button{cursor:pointer;font-weight:650}.clear:hover{background:#eef0f2}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:22px 0 12px}
#count,#status{font-size:14px;color:var(--muted);margin:0}.results{display:grid;gap:10px}
.song{display:flex;justify-content:space-between;align-items:center;gap:18px;border:1px solid var(--line);border-radius:12px;padding:16px}
.song-main{min-width:0}.artist{margin:0 0 2px;font-size:16px;font-weight:750;overflow-wrap:anywhere}.title{margin:0;font-size:15px;overflow-wrap:anywhere}
.meta{margin:8px 0 0;color:var(--muted);font-size:13px}.listen{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:auto;min-height:40px;padding:8px 13px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.listen:hover{background:var(--hover)}.empty{padding:28px 16px;border:1px dashed #cfd3d8;border-radius:12px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:12px}
@media(max-width:640px){header{padding-top:27px}.filters{grid-template-columns:1fr;padding:14px;gap:12px}.summary{align-items:flex-start;flex-direction:column}.song{align-items:flex-start;flex-direction:column;gap:12px;padding:14px}.listen{width:100%}}
</style></head>
<body>
<header><div class="wrap"><h1>TLMD kantak</h1><p class="subtitle">Harreman baten soinu banda</p></div></header>
<main class="wrap">
<section class="filters" aria-label="Bilaketa-iragazkiak">
<div class="field"><label for="artist">Artista</label><input id="artist" type="search" placeholder="Adib. The National" autocomplete="off"></div>
<div class="field"><label for="song">Abestia</label><input id="song" type="search" placeholder="Adib. Bloodbuzz" autocomplete="off"></div>
<div class="field"><label for="sender">Igorlea · nork bidalita</label><select id="sender"><option value="">Guztiak</option></select></div>
<div class="field"><label for="year">Urtea</label><select id="year"><option value="">Urte guztiak</option></select></div>
<div class="field"><label for="from">Noiztik</label><input id="from" type="date"></div>
<div class="field"><label for="to">Noiz arte</label><input id="to" type="date"></div>
<div class="field"><label for="sort">Emaitzak ordenatu</label><select id="sort"><option value="newest">Berrienak lehenengo</option><option value="oldest">Zaharrenak lehenengo</option><option value="artist">Artista A–Z</option><option value="song">Abestia A–Z</option></select></div>
<div class="field"><label>&nbsp;</label><button class="clear" id="clear" type="button">Garbitu iragazkiak</button></div>
</section>
<div class="summary"><p id="count" aria-live="polite">Abestiak kargatzen…</p><p id="status" role="status"></p></div>
<section id="results" class="results" aria-label="Bilaketaren emaitzak"></section>
</main><footer><div class="wrap">TLMD kantak · soinu banda</div></footer>
<script>
const DATA_FILE="kantak.txt";
const f={artist:document.getElementById("artist"),song:document.getElementById("song"),sender:document.getElementById("sender"),year:document.getElementById("year"),from:document.getElementById("from"),to:document.getElementById("to"),sort:document.getElementById("sort")};
const resultsEl=document.getElementById("results"),countEl=document.getElementById("count"),statusEl=document.getElementById("status");let songs=[];
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("eu").trim()}
function parseDate(v){const m=String(v??"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]),dt=new Date(Date.UTC(y,mo-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d?dt:null}
function parseTsv(text){
 const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim()!=="");if(lines.length<2)throw Error("Fitxategia hutsik dago edo goiburuak baino ez ditu.");
 const headers=lines[0].split("\t").map(norm),idx=n=>headers.indexOf(norm(n)),required=["Data","Ordua","Izena","URL","Artista","Abestia"],missing=required.filter(n=>idx(n)<0);
 if(missing.length)throw Error("Ez ditut zutabe hauek aurkitu: "+missing.join(", ")+". Egiaztatu goiburuak eta tabuladore bidez bereizita daudela.");
 return lines.slice(1).map((line,i)=>{const c=line.split("\t"),get=n=>(c[idx(n)]??"").trim(),date=parseDate(get("Data")),artist=get("Artista"),song=get("Abestia");if(!artist&&!song)return null;return{id:get("Zkia")||String(i+1),year:get("Urtea")||(date?String(date.getUTCFullYear()):""),dateText:get("Data"),date,time:get("Ordua"),sender:get("Izena"),url:get("URL"),artist,song}}).filter(Boolean)
}
function fill(select,values,label){select.replaceChildren(new Option(label,""));[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"eu",{sensitivity:"base"})).forEach(v=>select.add(new Option(v,v)))}
function resultCard(s){
 const card=document.createElement("article");card.className="song";const main=document.createElement("div");main.className="song-main";
 const a=document.createElement("h2");a.className="artist";a.textContent=s.artist||"Artista ezezaguna";const t=document.createElement("p");t.className="title";t.textContent=s.song||"Izenburu ezezaguna";
 const m=document.createElement("p");m.className="meta";m.textContent="📅 "+(s.dateText||"Data ezezaguna")+(s.time?" · "+s.time:"")+(s.sender?" · "+s.sender:"");main.append(a,t,m);card.append(main);
 try{const u=new URL(s.url);if(!["https:","http:"].includes(u.protocol))throw Error();const l=document.createElement("a");l.className="listen";l.href=u.href;l.target="_blank";l.rel="noopener noreferrer";l.textContent="▶ Ireki YouTuben";card.append(l)}catch{const x=document.createElement("span");x.className="meta";x.textContent="Esteka ez da baliozkoa";card.append(x)}return card
}
function render(){
 const aq=norm(f.artist.value),sq=norm(f.song.value),sender=f.sender.value,year=f.year.value,from=f.from.value?new Date(f.from.value+"T00:00:00Z"):null,to=f.to.value?new Date(f.to.value+"T23:59:59Z"):null;
 let list=songs.filter(s=>(!aq||norm(s.artist).includes(aq))&&(!sq||norm(s.song).includes(sq))&&(!sender||s.sender===sender)&&(!year||s.year===year)&&(!from||(s.date&&s.date>=from))&&(!to||(s.date&&s.date<=to)));
 const ts=s=>s.date?s.date.getTime():0;switch(f.sort.value){case"oldest":list.sort((a,b)=>ts(a)-ts(b)||(a.time||"").localeCompare(b.time||""));break;case"artist":list.sort((a,b)=>a.artist.localeCompare(b.artist,"eu",{sensitivity:"base"})||a.song.localeCompare(b.song,"eu",{sensitivity:"base"}));break;case"song":list.sort((a,b)=>a.song.localeCompare(b.song,"eu",{sensitivity:"base"}));break;default:list.sort((a,b)=>ts(b)-ts(a)||(b.time||"").localeCompare(a.time||""))}
 countEl.textContent=list.length+(list.length===1?" abesti aurkitu da":" abesti aurkitu dira");resultsEl.replaceChildren();if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="Ez da bat datorren abestirik aurkitu. Saiatu bilaketa aldatzen edo iragazkiak garbitzen.";resultsEl.append(e);return}const frag=document.createDocumentFragment();list.forEach(s=>frag.append(resultCard(s)));resultsEl.append(frag)
}
function clearFilters(){f.artist.value="";f.song.value="";f.sender.value="";f.year.value="";f.from.value="";f.to.value="";f.sort.value="newest";render()}
Object.values(f).forEach(el=>{el.addEventListener("input",render);el.addEventListener("change",render)});document.getElementById("clear").addEventListener("click",clearFilters);
async function start(){try{const r=await fetch(DATA_FILE,{cache:"no-store"});if(!r.ok)throw Error("Ezin izan da kantak.txt kargatu ("+r.status+" errorea). Egiaztatu index.html fitxategiaren ondoan dagoela eta izena zuzena dela.");songs=parseTsv(await r.text());fill(f.sender,songs.map(s=>s.sender),"Guztiak");fill(f.year,songs.map(s=>s.year),"Urte guztiak");statusEl.textContent="";render()}catch(e){countEl.textContent="Ezin izan dira abestiak kargatu.";statusEl.textContent=e.message;resultsEl.replaceChildren();const h=document.createElement("div");h.className="empty";h.textContent="Egiaztatu kantak.txt fitxategia: goiburuak eta zutabeak tabuladorez bereizita egon behar dira.";resultsEl.append(h)}}
start();
</script></body></html>
