<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TLMD</title>
<link rel="icon" type="image/jpeg" href="portada.jpg">
<link rel="apple-touch-icon" href="portada.jpg">
<style>
#access-gate{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:#070b14ed;backdrop-filter:blur(10px)}
#access-gate.open{display:flex}
.gate-card{width:min(100%,360px);padding:28px 24px;border:1px solid #2a3650;border-radius:20px;background:#111a2b;box-shadow:0 24px 80px #0008;text-align:left}
.gate-mark{font-size:11px;letter-spacing:.18em;color:#a8f06a;font-weight:800;margin:0 0 10px}
.gate-card h2{font-size:25px;margin:0 0 7px;letter-spacing:-.5px}
.gate-card p{font-size:13px;line-height:1.5;color:#aeb8ca;margin:0 0 19px}
#gate-password{width:100%;padding:13px 14px;border:1px solid #394762;border-radius:10px;background:#0b1020;color:#fff;font:inherit;font-size:16px;outline:none}
#gate-password:focus{border-color:#a8f06a;box-shadow:0 0 0 3px #a8f06a22}
.gate-remember{display:flex;align-items:center;gap:9px;margin:14px 0 18px;color:#cbd3e1;font-size:13px}
.gate-remember input{accent-color:#a8f06a;width:16px;height:16px}
#gate-submit{width:100%;border:0;border-radius:10px;padding:12px;background:#a8f06a;color:#101827;font:inherit;font-weight:850;cursor:pointer}
#gate-error{min-height:18px;color:#ffb6b6;font-size:12px;margin:10px 0 0}

*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
#cover{position:relative;width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;border:0;background:radial-gradient(ellipse at center,#17233a 0%,#0b1020 68%);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:28px 18px}
#cover:focus-visible{outline:3px solid #a8f06a;outline-offset:-8px}
.center{display:flex;flex-direction:column;align-items:center;transform:translateY(-1vh)}
.project-title{font-size:clamp(13px,3.5vw,18px);font-weight:400;line-height:1.2;letter-spacing:.045em;color:#b9c1d0;white-space:nowrap;margin:0 0 12px}
.presents{font-size:clamp(11px,3vw,14px);font-style:italic;font-weight:400;line-height:1.2;letter-spacing:.04em;color:#aeb8ca;margin:0 0 24px}
.cover-art{display:block;width:clamp(112px,32vw,190px);height:clamp(112px,32vw,190px);object-fit:cover;border-radius:4px;margin:0 auto 24px;box-shadow:0 14px 42px #0006}
.title{font-size:clamp(42px,12vw,82px);font-weight:900;letter-spacing:.12em;line-height:1}
.cover-subtitle{margin-top:10px;font-size:14px;font-weight:400;letter-spacing:.04em;color:#aeb8ca;line-height:1.4}
.signature{position:absolute;left:16px;right:16px;bottom:max(22px,env(safe-area-inset-bottom));font-size:12px;letter-spacing:.08em;color:#aeb8ca}
</style>
</head>
<body>
<button id="cover" type="button" aria-label="TLMD kantak ireki">
  <span class="center">
    <span class="project-title">The Little Man Dissapearing</span>
    <span class="presents">presents:</span>
    <img class="cover-art" src="portada.jpg" alt="Portada de TLMD">
    <span class="title">TLMD</span>
    <span class="cover-subtitle">harreman baten soinu banda</span>
  </span>
  <span class="signature">Buli 2026/11/20</span>
</button>
<div id="access-gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <form class="gate-card" id="gate-form">
    <div class="gate-mark">TLMD · SARBIDEA</div>
    <h2 id="gate-title">Pasahitza?</h2>
    <p>Harreman baten soinu bandak ate txiki bat dauka. Sartu pasahitza barrura sartzeko.</p>
    <input id="gate-password" type="password" autocomplete="current-password" placeholder="Pasahitza" aria-label="Pasahitza" required>
    <label class="gate-remember"><input id="gate-remember" type="checkbox" checked> Gogoratu nabigatzaile honetan</label>
    <button id="gate-submit" type="submit">Sartu</button>
    <div id="gate-error" role="alert"></div>
  </form>
</div>
<script>
(()=>{
  const PASSWORD='telemando';
  const gate=document.getElementById('access-gate');
  const form=document.getElementById('gate-form');
  const input=document.getElementById('gate-password');
  const error=document.getElementById('gate-error');
  const hasAccess=()=>localStorage.getItem('tlmd_access')==='1'||sessionStorage.getItem('tlmd_access')==='1';
  function openGate(){gate.classList.add('open');setTimeout(()=>input.focus(),50)}
  document.getElementById('cover').addEventListener('click',()=>{if(hasAccess())location.href='erreproduzitzailea.html';else openGate()});
  if(new URLSearchParams(location.search).get('auth')==='1'&&!hasAccess())openGate();
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(input.value!==PASSWORD){error.textContent='Ez da pasahitz zuzena. Saiatu berriro.';input.select();return}
    if(document.getElementById('gate-remember').checked){localStorage.setItem('tlmd_access','1');sessionStorage.removeItem('tlmd_access')}
    else{sessionStorage.setItem('tlmd_access','1');localStorage.removeItem('tlmd_access')}
    location.href='erreproduzitzailea.html';
  });
})();
</script>
</body>
</html>
